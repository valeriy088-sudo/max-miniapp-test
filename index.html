<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест видеоплеера MAX</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            max-width: 900px;
            display: block;
            background: #000;
            border-radius: 10px;
        }

        p {
            color: #bbb;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Тест HTML5-видеоплеера внутри мини-приложения MAX</h1>

    <video controls playsinline preload="metadata">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        Ваш браузер не поддерживает HTML5-видео.
    </video>

    <p>
        Если появился видеоплеер и видео воспроизводится,
        значит MAX позволяет воспроизводить внешнее HTML5-видео
        внутри мини-приложения.
    </p>

</div>

</body>
</html>

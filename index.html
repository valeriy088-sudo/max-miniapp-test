<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            background: #000;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Тест внешнего видеоплеера через iframe</h1>

    <iframe
        src="player.html"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

</div>

</body>
</html>
